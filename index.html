<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141615">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Setlog · Workout journal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Workout journal</p>
    <h1>Setlog<span class="brand-dot">.</span></h1>
    <p class="muted">Log your lifts, one set at a time.</p>
  </header>
  <nav aria-label="Workout views">
    <button id="logTab" type="button" aria-controls="log" aria-pressed="true">Log workout</button>
    <button id="historyTab" type="button" aria-controls="history" aria-pressed="false">History</button>
  </nav>
  <div id="log">
    <section aria-labelledby="sessionTitle">
      <div class="row spread"><h2 id="sessionTitle">Session</h2><small id="today"></small></div>
      <label for="day" class="day-label">Day of the week</label>
      <select id="day">
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
    </section>
    <form id="workout">
      <div id="exercises"></div>
      <section class="exercise-entry">
        <details id="exercisePicker">
          <summary>+ Choose exercise</summary>
        <div class="fields name-row">
          <label>Search or add your own<input id="name" type="text" maxlength="100" placeholder="Search exercises…" enterkeyhint="go" autocomplete="off"></label>
          <button id="addExercise" type="button">Add</button>
        </div>
          <p class="muted picker-help">Tap an exercise to add it. Previous sets fill in automatically.</p>
          <div id="exerciseChoices"></div>
        </details>
        <p id="exerciseHint" class="muted" hidden>Save the open exercise before adding another or saving the workout.</p>
      </section>
      <button id="save" class="primary wide" disabled>Save workout</button>
      <button id="cancelEdit" class="wide" type="button" hidden>Cancel edit</button>
    </form>
  </div>
  <div id="history" hidden></div>
  <p id="status" role="status"></p>
  <p class="muted foot">Stored on this device · Weights in kg</p>
</main>
<template id="exerciseTemplate">
  <article>
    <div class="row spread">
      <h3></h3>
      <button class="edit-exercise" type="button" hidden>Edit</button>
      <button class="remove remove-exercise" type="button">×</button>
    </div>
    <ul class="exercise-summary muted" aria-label="Saved sets" hidden></ul>
    <div class="exercise-editor">
      <div class="sets"></div>
      <div class="row exercise-actions">
        <button class="add-set" type="button">+ Set</button>
        <button class="save-exercise primary" type="button">Save exercise</button>
      </div>
    </div>
  </article>
</template>
<template id="setTemplate">
  <div class="set">
    <div class="fields">
      <small class="set-number"></small>
      <label>Reps<input class="reps" type="number" inputmode="numeric" min="1" step="1" required></label>
      <label>Weight (kg)<input class="weight" type="number" inputmode="decimal" min="0" step="any" required></label>
      <button class="remove" type="button">×</button>
    </div>
    <div class="set-feedback">
      <fieldset class="effort">
        <legend>How hard was it? <small>(optional)</small></legend>
        <div class="effort-options"></div>
      </fieldset>
      <label class="reps-left-label" title="How many more reps could you have done?">Reps left <small>(optional)</small><input class="reps-left" type="number" inputmode="numeric" min="0" step="1" placeholder="—"></label>
    </div>
  </div>
</template>
<script src="app.js"></script>
</body>
</html>
